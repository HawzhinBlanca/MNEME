[package]
name = "mneme-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MNEME fail-closed memory gate (CLI adoption layer)"

[lib]
name = "mneme_cli"
path = "src/lib.rs"

[[bin]]
name = "mneme"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
mneme-core.workspace = true
mneme-crypto.workspace = true
mneme-cap.workspace = true
mneme-store = { workspace = true, features = ["phase_iii_prove_forget"] }
mneme-verify.workspace = true
mneme-pace.workspace = true
mneme-index.workspace = true
mneme-smt.workspace = true
mneme-account.workspace = true
mnemed = { path = "../mnemed" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
base64.workspace = true
sha2 = "0.10"

[features]
default = []
# Forward the store's optional hash-chained root pace-log (`meta/root-pace.log`).
# OFF by default; see `mneme-store`'s `root_pace_log` feature for the honesty caveats
# (it is NOT an RFC6962 transparency log).
root_pace_log = ["mneme-store/root_pace_log"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
mneme-cap.workspace = true
mneme-core.workspace = true
mneme-crypto.workspace = true
mneme-store.workspace = true
mneme-verify.workspace = true
mneme-index.workspace = true
hex.workspace = true
walkdir = "2.5"
