[package]
name = "mneme-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for verified memory tools (Wave 6 adoption — blueprint §14.1)"

[[bin]]
name = "mneme-mcp"
path = "src/main.rs"

[dependencies]
mneme-cap.workspace = true
mneme-core.workspace = true
mneme-crypto.workspace = true
mneme-store.workspace = true
blake3.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = []
phase_iii_bind = [
    "mneme-store/phase_iii_bind",
    "mneme-store/phase_iii_verify",
]

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "phase_iii_mcp"
path = "tests/phase_iii_mcp.rs"
required-features = ["phase_iii_bind"]
