[package]
name = "mnemed"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MNEME local-first daemon: HTTP, gRPC, WebSocket, Unix-socket kernel API"
autotests = false

[[bin]]
name = "mnemed"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[test]]
name = "api_integration"
path = "tests/api_integration.rs"

[[test]]
name = "two_peer_sync"
path = "tests/two_peer_sync.rs"

[[test]]
name = "two_peer_ws_sync"
path = "tests/two_peer_ws_sync.rs"

[[test]]
name = "v11_object_sync"
path = "tests/v11_object_sync.rs"

[[test]]
name = "unix_api"
path = "tests/unix_api.rs"

[[test]]
name = "redteam_paths"
path = "tests/redteam_paths.rs"

[dependencies]
mneme-core.workspace = true
mneme-crypto.workspace = true
mneme-cap.workspace = true
mneme-store.workspace = true
mneme-gate = { workspace = true, optional = true }
mneme-crdt.workspace = true
mneme-smt.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tonic.workspace = true
prost.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
ciborium.workspace = true
hex.workspace = true
tokio-stream = "0.1"
clap = { version = "4.5", features = ["derive"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

[dev-dependencies]
tempfile.workspace = true
reqwest = { version = "0.12", features = ["json"] }
tonic = { workspace = true, features = ["transport"] }

[build-dependencies]
tonic-build = "0.13"
# Self-sufficient protoc: vendored binary so the build never depends on a
# system `protoc` being installed (fixes CI/e2e-daemon + fresh local checkouts).
protoc-bin-vendored = "3"

[features]
default = []
context_gate = ["mneme-store/context_gate", "dep:mneme-gate"]
