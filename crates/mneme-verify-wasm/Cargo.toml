[package]
name = "mneme-verify-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser/WASM offline auditor: verify MNEME receipts (ROBR / MTL / Shapley) in-browser, zero-install, without trusting the operator's server"

[lib]
# cdylib for the wasm artifact; rlib so the verify logic is unit-testable natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
mneme-core.workspace = true
mneme-account.workspace = true
mneme-receipts.workspace = true
wasm-bindgen = "0.2"
base64.workspace = true
hex.workspace = true
serde_json.workspace = true

# ed25519-dalek's `rand_core` feature pulls `getrandom`, which refuses to compile on
# wasm32-unknown-unknown unless its `js` backend is enabled. Verification itself uses
# no randomness; this only satisfies the transitive compile requirement on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
