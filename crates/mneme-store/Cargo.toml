[package]
name = "mneme-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mneme-core.workspace = true
mneme-crypto.workspace = true
mneme-smt.workspace = true
mneme-dag.workspace = true
mneme-root.workspace = true
mneme-cap.workspace = true
mneme-verify.workspace = true
mneme-index.workspace = true
mneme-forget.workspace = true
mneme-crdt.workspace = true
mneme-account.workspace = true
mneme-pace = { workspace = true, optional = true }
mneme-context = { workspace = true, optional = true }
mneme-gate = { workspace = true, optional = true }
rand.workspace = true
blake3.workspace = true
ciborium.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
libc = "0.2"

[features]
default = []
# Bi-temporal / point-in-time recall (`recall_verified_at`, Phase I P1-2). OFF in
# lean default: it is the sole consumer of per-commit full key-index snapshots,
# which impose O(N) write latency and O(N x writes) disk at scale. The lean MCP
# surface exposes no time/sequence recall, so the lean core does not pay this tax.
bitemporal_recall = []
# Optional hash-chained pace-log of committed roots (`meta/root-pace.log`). OFF by
# default: it rewrites the whole CBOR log per commit (O(n)), which would regress the
# lean O(1) write path. It is NOT an RFC6962 transparency log (no inclusion/consistency
# proofs, single-operator) and the log is derived/rebuildable from the checkpoint log.
root_pace_log = ["dep:mneme-pace"]
context_gate = ["mneme-index/context_gate", "dep:mneme-context", "dep:mneme-gate"]
phase_iii_bind = ["mneme-account/phase_iii_bind_action"]
phase_iii_verify = ["mneme-account/phase_iii_verify"]
phase_iii_prove_forget = ["mneme-account/phase_iii_prove_forget", "phase_iii_verify"]
phase_iii_require_action = ["phase_iii_verify"]

[dev-dependencies]
tempfile.workspace = true
rand.workspace = true
hex.workspace = true
mneme-pace.workspace = true

[[test]]
name = "checkpoint_log"
path = "tests/checkpoint_log.rs"

[[test]]
name = "e2e"
path = "../../tests/e2e/mod.rs"
harness = true

[[test]]
name = "tamper_suite"
path = "../../tests/tamper_suite.rs"
harness = true

[[test]]
name = "bench_recall"
path = "../../tests/bench_recall.rs"
harness = true

[[test]]
name = "chaos"
path = "../../tests/chaos/mod.rs"
harness = true

[[test]]
name = "phase_ii_context_gate"
path = "tests/phase_ii_context_gate.rs"
required-features = ["context_gate"]

[[test]]
name = "phase_iii_bind"
path = "tests/phase_iii_bind.rs"

[[test]]
name = "phase_iii_forget"
path = "tests/phase_iii_forget.rs"
required-features = ["phase_iii_prove_forget", "phase_iii_verify"]

[[test]]
name = "phase_iii_policy"
path = "tests/phase_iii_policy.rs"
required-features = ["phase_iii_bind", "phase_iii_require_action"]

[[test]]
name = "root_pace_log"
path = "tests/root_pace_log.rs"
required-features = ["root_pace_log"]
