[package]
name = "mneme-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mneme-core.workspace = true
mneme-crypto.workspace = true
mneme-smt.workspace = true
mneme-dag.workspace = true
mneme-root.workspace = true
mneme-cap.workspace = true
mneme-verify.workspace = true
mneme-index.workspace = true
mneme-forget.workspace = true
mneme-crdt = { workspace = true, optional = true }
mneme-account.workspace = true
mneme-context = { workspace = true, optional = true }
mneme-gate = { workspace = true, optional = true }
rand.workspace = true
blake3.workspace = true
ciborium.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"

[features]
default = []
bench_support = []
internal_test_support = []
# Bi-temporal / point-in-time recall (`recall_verified_at`, Phase I P1-2). OFF in
# lean default: it is the sole consumer of per-commit full key-index snapshots,
# which impose O(N) write latency and O(N x writes) disk at scale. The lean MCP
# surface exposes no time/sequence recall, so the lean core does not pay this tax.
bitemporal_recall = []
erasure_receipt = ["mneme-account/phase_iii_prove_forget", "phase_iii_verify"]
experimental_sync_crdt = ["dep:mneme-crdt"]
experimental_semantic = [
    "mneme-index/experimental_semantic",
    "mneme-verify/experimental_semantic",
]
experimental_cognition_cert = ["experimental_semantic", "mneme-index/cognition_cert"]
experimental_redaction = ["mneme-forget/experimental_redaction"]
experimental_action_accountability = [
    "mneme-account/phase_iii_bind_action",
    "mneme-account/phase_iii_verify",
]
context_gate = [
    "experimental_cognition_cert",
    "mneme-index/context_gate",
    "dep:mneme-context",
    "dep:mneme-gate",
]
phase_iii_bind = ["experimental_action_accountability"]
phase_iii_verify = ["mneme-account/phase_iii_verify"]
phase_iii_prove_forget = ["erasure_receipt"]
phase_iii_require_action = ["phase_iii_verify"]

[dev-dependencies]
tempfile.workspace = true
rand.workspace = true
hex.workspace = true

[[test]]
name = "e2e"
path = "../../tests/e2e/mod.rs"
harness = true
required-features = ["internal_test_support"]

[[test]]
name = "tamper_suite"
path = "../../tests/tamper_suite.rs"
harness = true
required-features = ["internal_test_support"]

[[test]]
name = "bench_recall"
path = "../../tests/bench_recall.rs"
harness = true
required-features = ["bench_support", "internal_test_support"]

[[test]]
name = "chaos"
path = "../../tests/chaos/mod.rs"
harness = true
required-features = ["internal_test_support"]

[[test]]
name = "phase_ii_context_gate"
path = "tests/phase_ii_context_gate.rs"
required-features = ["context_gate"]

[[test]]
name = "phase_iii_bind"
path = "tests/phase_iii_bind.rs"
required-features = ["phase_iii_bind"]

[[test]]
name = "phase_iii_forget"
path = "tests/phase_iii_forget.rs"
required-features = ["erasure_receipt"]

[[test]]
name = "phase_iii_policy"
path = "tests/phase_iii_policy.rs"
required-features = ["phase_iii_bind", "phase_iii_require_action"]
