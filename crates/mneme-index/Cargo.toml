[package]
name = "mneme-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Key-index + authenticated semantic ANN (blueprint §5.6, §9.2)"

[dependencies]
mneme-core.workspace = true
mneme-crypto.workspace = true
mneme-root.workspace = true
mneme-smt.workspace = true
mneme-gate = { workspace = true, optional = true }
mneme-context = { workspace = true, optional = true }
blake3 = "1.8"
thiserror.workspace = true
fast-hnsw = "1.0.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hex = { workspace = true, optional = true }
ureq = { version = "2.10", optional = true, default-features = false, features = ["json"] }
# 12-month milestone (B3) ZK retrieval backend, only linked under `pedersen_schnorr_zk`.
# NOTE: Plonky2 1.x requires nightly (`feature(specialization)` in plonky2_field) and is
# incompatible with the repo's pinned stable toolchain (rust-toolchain.toml = 1.86.0). We
# therefore ship a real *transparent* zero-knowledge proof (Pedersen commitments + a
# Schnorr equality-of-openings NIZK over Ristretto, no trusted setup) that compiles on
# stable and reuses the curve25519-dalek already in the tree. See pedersen_schnorr_zk.rs.
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "rand_core", "precomputed-tables"], optional = true }
rand = { version = "0.8", optional = true }

[features]
default = ["ads"]
ads = []
# Phase II Context Gate verification; off by default.
context_gate = ["mneme-gate", "mneme-gate/phase_ii_gate_open", "dep:mneme-context"]
# Tagged BLAKE3 commitment-binding envelope (§9.2). Binding only — NOT zero-knowledge, NOT SNARK, NOT Plonky2.
# (The legacy `zk = ["commitment_binding"]` Cargo feature alias was removed because it
# implied zero-knowledge, which the BLAKE3 envelope is not. The regression test
# `commitment_binding_receipt_is_not_zk` in lib.rs asserts the envelope tag does not
# contain "ZK", "PLONKY2", or "SNARK" — protecting against re-introduction.)
commitment_binding = []
# 12-month milestone (B3): real transparent zero-knowledge proof (Pedersen + Schnorr over
# Ristretto) of a private retrieval-match statement — knowledge that a committed entry equals
# a hidden query. Zero-knowledge + no trusted setup — NOT semantic truth, NOT exact-NN /
# not exact nearest-neighbor. Phase I ExactDominance proves membership/completeness
# plus top-k over prover-asserted distances; true top-k ranking is not proven, and
# this is not top-k by true query-to-embedding distance until verifiers recompute
# candidate distances. Backend is Pedersen/Schnorr, NOT Plonky2/FRI (Plonky2 1.x is nightly-only).
# The feature name reflects the actual backend. The `B3_DEFERRAL_STATUS` string in
# `pedersen_schnorr_zk.rs` records the Plonky2/FRI SNARK deferral.
pedersen_schnorr_zk = ["dep:curve25519-dalek", "dep:rand"]
# Deprecated compatibility alias for pre-rename operator/CI commands. This enables the
# same honest Pedersen+Schnorr backend; it does not add or claim Plonky2/FRI.
plonky2_prover = ["pedersen_schnorr_zk"]
# Phase IV-A research seam (UNIMPLEMENTED). Off by default; wired into NO recall/receipt/
# verify path. The entry point returns UnsupportedVersion so it can never fabricate a proof.
# Proves NOTHING — not exact-NN, not Plonky2/FRI, not a SNARK. Pure research placeholder
# for the zkRAG-style global exact-NN direction. Current Phase I ExactDominance
# proves membership/completeness plus top-k over prover-asserted distances; true
# top-k ranking is not proven, and this is not top-k by true query-to-embedding
# distance until verifiers recompute candidate distances. See docs/research/PHASE_IV_A_PIOP_SPIKE.md
# and the `piop_research_seam_is_honest` regression test in lib.rs.
piop_research = []
# Trick #1 online drand fetch (optional; offline path uses carried beacon bytes).
beacon_online = ["dep:ureq", "dep:hex"]
context_set_lock = ["pedersen_schnorr_zk"]

[[test]]
name = "semantic_zk_recall"
path = "tests/semantic_zk_recall.rs"
required-features = ["pedersen_schnorr_zk"]

[[test]]
name = "cognition_cert_v1"
path = "tests/cognition_cert_v1.rs"

[[test]]
name = "beacon_spot_check"
path = "tests/beacon_spot_check.rs"

[[test]]
name = "byzantine_inference"
path = "tests/byzantine_inference.rs"

[[test]]
name = "context_set_lock"
path = "tests/context_set_lock.rs"
required-features = ["context_set_lock"]

[[test]]
name = "zkann_exact_dominance"
path = "tests/zkann_exact_dominance.rs"

[dev-dependencies]
hex.workspace = true
mneme-context = { workspace = true }
proptest = "1.6"
serde_json.workspace = true
tempfile.workspace = true
