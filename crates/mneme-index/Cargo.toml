[package]
name = "mneme-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Key-index + authenticated semantic ANN (blueprint §5.6, §9.2)"

[dependencies]
mneme-core.workspace = true
mneme-smt.workspace = true
blake3 = "1.8"
thiserror.workspace = true
fast-hnsw = "1.0.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[features]
default = ["ads"]
ads = []
# Tagged BLAKE3 commitment-binding envelope (§9.2). Binding only — NOT zero-knowledge, NOT SNARK, NOT Plonky2.
commitment_binding = []
# Deprecated alias for `commitment_binding` (name does not imply Plonky2/SNARK).
zk = ["commitment_binding"]
# 12-month milestone only (B3): no Plonky2 crate linked; prove/verify fail closed until prover ships.
plonky2_prover = []

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true