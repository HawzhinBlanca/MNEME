[package]
name = "mneme-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Key-index + authenticated semantic ANN (blueprint §5.6, §9.2)"

[dependencies]
mneme-core.workspace = true
mneme-smt.workspace = true
blake3 = "1.8"
thiserror.workspace = true
fast-hnsw = "1.0.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# 12-month milestone (B3) ZK retrieval backend, only linked under `plonky2_prover`.
# NOTE: Plonky2 1.x requires nightly (`feature(specialization)` in plonky2_field) and is
# incompatible with the repo's pinned stable toolchain (rust-toolchain.toml = 1.86.0). We
# therefore ship a real *transparent* zero-knowledge proof (Pedersen commitments + a
# Schnorr equality-of-openings NIZK over Ristretto, no trusted setup) that compiles on
# stable and reuses the curve25519-dalek already in the tree. See plonky2_prover.rs.
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "rand_core", "precomputed-tables"], optional = true }
rand = { version = "0.8", optional = true }

[features]
default = ["ads"]
ads = []
# Tagged BLAKE3 commitment-binding envelope (§9.2). Binding only — NOT zero-knowledge, NOT SNARK, NOT Plonky2.
commitment_binding = []
# Deprecated alias for `commitment_binding` (name does not imply Plonky2/SNARK).
zk = ["commitment_binding"]
# 12-month milestone (B3): real transparent zero-knowledge proof (Pedersen + Schnorr over
# Ristretto) of a private retrieval-match statement — knowledge that a committed entry equals
# a hidden query. Zero-knowledge + no trusted setup — NOT semantic truth, NOT exact-NN
# (blueprint §3). Backend is Pedersen/Schnorr, NOT Plonky2/FRI (Plonky2 1.x is nightly-only).
plonky2_prover = ["dep:curve25519-dalek", "dep:rand"]

[[test]]
name = "semantic_zk_recall"
path = "tests/semantic_zk_recall.rs"
required-features = ["plonky2_prover"]

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
