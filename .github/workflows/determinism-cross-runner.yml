# Audit B4: foundation-gate digests must match across distinct GitHub-hosted runners.
# Honest substitute when MNEME_SECOND_HOST SSH peer is not configured.
# Dual-workspace (same runner) remains in reliability.yml determinism lane.

name: Determinism cross-runner

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 0"

concurrency:
  group: determinism-cross-runner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  MNEME_DETERMINISM_TS: "1970-01-01T00:00:00Z"

jobs:
  foundation-gate-matrix:
    name: foundation-gate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: gh-ubuntu
          - os: macos-latest
            label: gh-macos
    env:
      MNEME_RUNNER_LABEL: ${{ matrix.label }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/out/ci-targets/cross-runner-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.86.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mneme-cross-runner-${{ matrix.label }}

      - name: Foundation gate (cross-runner)
        run: bash scripts/ci/determinism-cross-runner.sh gate --label "${{ matrix.label }}"

      - name: Upload cross-runner report
        uses: actions/upload-artifact@v4
        with:
          name: foundation-gate-${{ matrix.label }}
          path: |
            out/ci-cross-runner/${{ matrix.label }}/foundation.report.json
            out/ci-cross-runner/${{ matrix.label }}/digest-manifest.json
          retention-days: 14

  compare-digests:
    name: compare digests (ubuntu vs macos)
    runs-on: ubuntu-latest
    needs: foundation-gate-matrix
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download runner reports
        uses: actions/download-artifact@v4
        with:
          # NO merge-multiple: keep each runner's report under its own artifact
          # subdir (artifacts/foundation-gate-gh-{ubuntu,macos}/...). Merging would
          # collapse both `foundation.report.json` files onto each other.
          pattern: foundation-gate-*
          path: artifacts

      - name: Compare foundation-gate digests across runners
        run: |
          set -euo pipefail
          UBUNTU="$(find artifacts -path '*foundation-gate-gh-ubuntu*/foundation.report.json' | head -1)"
          MACOS="$(find artifacts -path '*foundation-gate-gh-macos*/foundation.report.json' | head -1)"
          if [[ -z "$UBUNTU" || -z "$MACOS" ]]; then
            echo "Missing cross-runner reports (ubuntu=$UBUNTU macos=$MACOS)" >&2
            find artifacts -type f >&2 || true
            exit 1
          fi
          echo "ubuntu report: $UBUNTU"
          echo "macos  report: $MACOS"
          bash scripts/ci/determinism-cross-runner.sh compare \
            "$UBUNTU" "$MACOS" gh-ubuntu gh-macos

  # `secrets.*` is NOT allowed in a job-level `if:` (GitHub rejects the whole
  # workflow file → "workflow file issue"). Read the secret inside a step, expose a
  # boolean output, and gate the optional SSH-peer job on that output instead.
  detect-peer:
    name: detect SSH peer secret
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_peer: ${{ steps.check.outputs.has_peer }}
    steps:
      - id: check
        env:
          PEER: ${{ secrets.MNEME_SECOND_HOST }}
        run: |
          if [[ -n "$PEER" ]]; then
            echo "has_peer=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_peer=false" >> "$GITHUB_OUTPUT"
          fi

  determinism-ssh-peer:
    name: determinism (SSH peer — ops)
    runs-on: ubuntu-latest
    needs: detect-peer
    if: ${{ needs.detect-peer.outputs.has_peer == 'true' }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/out/ci-targets/ssh-peer
      MNEME_DETERMINISM_TS: "1970-01-01T00:00:00Z"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.86.0

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MNEME_DETERMINISM_SSH_KEY }}

      - name: Trust peer host key
        run: |
          mkdir -p ~/.ssh
          host="${{ secrets.MNEME_SECOND_HOST }}"
          host="${host#*@}"
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts

      - name: Two-machine foundation gate (SSH)
        env:
          MNEME_SECOND_HOST: ${{ secrets.MNEME_SECOND_HOST }}
          MNEME_REMOTE_ROOT: ${{ secrets.MNEME_REMOTE_ROOT }}
          MNEME_STRICT_CROSS_HOST: "1"
        run: bash scripts/ci/determinism-two-machine.sh

  # Docker simulation needs NO second host or secrets: it builds one pinned image
  # and runs two isolated containers (--network none, distinct hostnames, no shared
  # volumes) so a cross-environment determinism proof always runs on every push/PR.
  # Same-kernel approximation of §17.7 (see docs/MNEME_SECOND_HOST.md) — a strong
  # proxy, not a two-physical-machine proof.
  determinism-docker-sim:
    name: determinism (docker simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Docker simulation foundation gate (two isolated containers)
        run: bash scripts/ci/determinism-two-machine.sh --docker

      - name: Upload docker-sim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-docker-sim
          path: |
            out/ci-two-machine-docker/docker-sim-manifest.json
            out/ci-two-machine-docker/container-alpha.report.json
            out/ci-two-machine-docker/container-bravo.report.json
          retention-days: 14

  b4-gate:
    name: B4 gate (cross-runner required)
    runs-on: ubuntu-latest
    needs:
      - compare-digests
      - determinism-ssh-peer
      - determinism-docker-sim
    if: always()
    steps:
      - name: Require cross-runner compare
        run: |
          if [[ "${{ needs.compare-digests.result }}" != "success" ]]; then
            echo "Cross-runner digest compare failed or was skipped."
            exit 1
          fi
          echo "B4 cross-runner proof: PASS (ubuntu-latest vs macos-latest)"

      - name: Require docker simulation
        run: |
          if [[ "${{ needs.determinism-docker-sim.result }}" != "success" ]]; then
            echo "Docker simulation determinism failed or was skipped."
            exit 1
          fi
          echo "B4 docker-sim proof: PASS (two isolated containers, byte-identical roots)"

      - name: SSH peer status
        run: |
          if [[ "${{ needs.determinism-ssh-peer.result }}" == "success" ]]; then
            echo "B4 SSH peer proof: PASS"
          elif [[ "${{ needs.determinism-ssh-peer.result }}" == "skipped" ]]; then
            echo "B4 SSH peer proof: skipped (MNEME_SECOND_HOST secret unset — cross-runner closes B4)"
          else
            echo "B4 SSH peer proof: FAILED (check MNEME_SECOND_HOST / MNEME_DETERMINISM_SSH_KEY)"
            exit 1
          fi
